name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!" >&2
            exit 1
          fi

          JAVA_RAW_OUTPUT=$(java -version 2>&1)
          echo "Raw Java version output:"
          echo "$JAVA_RAW_OUTPUT"

          # Extract major version number (e.g. 17 from "17.0.x" or 21 from "21.0.x")
          FIRST_LINE=$(echo "$JAVA_RAW_OUTPUT" | head -n 1)
          MAJOR_VERSION=$(echo "$FIRST_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to detect the active Java major version from '$FIRST_LINE'!" >&2
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version ($MAJOR_VERSION) is lower than required version 17!" >&2
            exit 1
          fi
          echo "Java 17+ environment confirmed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking temporary debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Could not create ./debug.keystore!" >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying debug APK output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK!" >&2
            echo "Searching only inside app/build/outputs/apk for any APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: The verified APK at $EXPECTED_APK is empty (0 bytes)!" >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension!" >&2; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK is not exactly app/build/outputs/apk/debug/app-debug.apk!" >&2
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK release asset ==="
          TEMP_DIR="$RUNNER_TEMP/stonic_release_asset"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          REPO_FULL="${{ github.repository }}"
          REPO_NAME="${REPO_FULL#*/}"
          # Sanitize repository name to safe filename characters (lowercase alphanumeric, dot, underscore, hyphen)
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g')

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_FILE="$TEMP_DIR/$RELEASE_FILENAME"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_FILE"

          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            echo "ERROR: Failed to prepare APK release asset at $TARGET_FILE!" >&2
            exit 1
          fi

          echo "Release asset prepared: $TARGET_FILE"
          echo "asset_path=$TARGET_FILE" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH!" >&2
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty!" >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset is not an .apk file!" >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<'EOF'
          ### Stonic AI Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **GitHub Actions Run Number**: #${{ github.run_number }}
          - **GitHub Actions Run Attempt**: #${{ github.run_attempt }}
          - **Source Commit SHA**: ${{ github.sha }}
          - **Testing Notice**: This APK is intended for testing and debugging purposes.
          - **Distribution Notice**: This APK is not a Play Store production release.
          - **Keystore**: Signed only with a temporary debug keystore.

          You can download the APK file directly from the **Assets** section below.
          EOF
          )

          echo "Creating release with tag: $RELEASE_TAG for commit: ${{ github.sha }}"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting APK Result ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release successfully created!"
            gh release view "$RELEASE_TAG"

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 📱 Debug APK Successfully Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was successfully built and published directly under GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page URL**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download Asset**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **How to install on phone**: Open the release page above on your phone browser, scroll to **Assets**, tap \`$ASSET_NAME\` to download, and install." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: The standard artifact \`app-debug-apk\` is also preserved on this workflow run page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete or was skipped. Check permissions or repository settings."
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            echo "### ⚠️ Debug APK Build Succeeded (Artifact Available)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK build and verification succeeded, but GitHub Release creation did not complete." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Download**: You can download the \`app-debug-apk\` artifact directly from the **Artifacts** section at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Troubleshooting**: Ensure the repository has **Settings -> Actions -> General -> Workflow permissions** set to **Read and write permissions**." >> "$GITHUB_STEP_SUMMARY"
          fi
